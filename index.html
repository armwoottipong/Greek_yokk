<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Greek Yogg. — Stock, POS & Menu Management</title>
  <meta name="theme-color" content="#780608">
  <link rel="icon" type="image/png" href="/Greek_yokk/brand/mascot.png">
  <link rel="preload" as="image" href="/Greek_yokk/brand/loading-mascot.png">
  <script>
    window.addEventListener('error', function (event) {
      if (event.target?.tagName !== 'SCRIPT' || event.target.type !== 'module') return
      function showFailure() {
        const screen = document.getElementById('app-loading')
        if (!screen) return
        screen.dataset.state = 'error'
        const message = screen.querySelector('[data-startup-message]')
        message.textContent = 'โหลดร้านไม่สำเร็จ ลองโหลดใหม่อีกครั้งนะ'
        message.setAttribute('role', 'alert')
        const retry = screen.querySelector('[data-startup-retry]')
        retry.hidden = false
        retry.onclick = function () { window.location.reload() }
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showFailure, { once: true })
      else showFailure()
    }, true)
  </script>
  <script type="module" crossorigin src="/Greek_yokk/assets/index-BX2LkcZL.js"></script>
  <link rel="stylesheet" crossorigin href="/Greek_yokk/assets/index-C__jfbvB.css">
</head>
<body class="h-full bg-[#FBF5EA] text-stone-900 flex flex-col md:flex-row overflow-hidden antialiased">
  <section id="app-loading" class="startup-screen" aria-label="กำลังเปิด Greek Yogg.">
    <div class="startup-content">
      <div class="startup-mascot-stage" aria-hidden="true">
        <img class="startup-mascot" src="/Greek_yokk/brand/loading-mascot.png" width="6000" height="6001" alt="">
      </div>
      <p class="startup-message" data-startup-message role="status" aria-live="polite">กำลังเตรียมร้านให้พร้อม…</p>
      <div class="startup-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <button class="startup-retry" data-startup-retry type="button" hidden>ลองโหลดใหม่</button>
      <noscript><p class="startup-message">เปิด JavaScript ในเบราว์เซอร์เพื่อเข้าใช้งานร้านนะ</p></noscript>
    </div>
  </section>
  <script>
    document.getElementById('app-loading').dataset.startedAt = String(performance.now())
  </script>
  <div id="app" inert class="w-full h-full flex flex-col md:flex-row overflow-hidden"></div>
</body>
</html>
