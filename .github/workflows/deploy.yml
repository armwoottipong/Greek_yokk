name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'production-pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: |
          npm test
          npm run lint
          npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Stamp release
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs')
          const entry = fs.readFileSync('dist/index.html', 'utf8').match(/<script[^>]+src="([^"]+)"/)[1]
          fs.writeFileSync('dist/version.json', JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,entry}))
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 15 "${PAGE_URL%/}/version.json?release=${EXPECTED_SHA}&attempt=${attempt}" -o /tmp/published-version.json && curl --fail --silent --show-error --max-time 15 "${PAGE_URL%/}/?release=${EXPECTED_SHA}&attempt=${attempt}" -o /tmp/published-index.html; then
              if node -e "const fs=require('node:fs'); const release=JSON.parse(fs.readFileSync('/tmp/published-version.json','utf8')); const html=fs.readFileSync('/tmp/published-index.html','utf8'); if(release.commit!==process.env.EXPECTED_SHA||!html.includes(release.entry))process.exit(1); console.log('Verified live commit '+release.commit)"; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production has not published the expected commit.' >&2
          exit 1
